[project]
name = "deaddemo"
version = "0.1.0"
description = "Demo manager for Deadlock: archive, parse and analyze replays"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.8,<7",
    "boon-deadlock>=0.9,<0.10",
    "polars>=1.0",
    "numpy>=2",
    "httpx>=0.27",
    "platformdirs>=4",
    "xlsxwriter>=3",
    "zstandard>=0.23",
]

[project.scripts]
deaddemo = "deaddemo.cli:main"

[project.gui-scripts]
deaddemo-gui = "deaddemo.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deaddemo"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pyinstaller>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP047"]
